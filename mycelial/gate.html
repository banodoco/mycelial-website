<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mycelial</title>
    <meta
      name="description"
      content="Open-source AI has unimaginable creative potential waiting to be unlocked. We believe a thriving open-source ecosystem can profoundly improve humanity’s relationship with AI."
    />
    <meta property="og:title" content="Mycelial" />

    />

      property="og:image:alt"

    <script>
      (() => {
        let still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        try {
          still = still || localStorage.getItem("deck-motion") === "off";
        } catch (e) {}
        document.documentElement.classList.add(still ? "g-still" : "g-wait");
      })();
    </script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url(../assets/fonts/deck/cormorant-italic-latin-ext.woff2) format("woff2");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF,
          U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url(../assets/fonts/deck/cormorant-italic-latin.woff2) format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
          U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "DM Sans";
        font-weight: 400;
        font-display: swap;
        src: url(../assets/fonts/deck/dm-sans-regular.woff2) format("woff2");
      }
      :root {
        --bg: #0d0a07;
        --ink: #efe6d6;
        --soft: #b8a98f;
        --gold: #e0ab5e;
        --safe-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
      }
      html {
        background: var(--bg);
      }
      body {
        overflow: hidden;
        font-family: "EB Garamond", Georgia, serif;
        background: transparent;
      }
      .g-net {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
      }
      .g-mark {
        position: fixed;
        left: 0;
        top: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
      }
      .g-mark.is-on {
        opacity: 1;
      }
      .g-name {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 2;
        transform-origin: 0 50%;
        pointer-events: none;
        white-space: nowrap;
        font:
          400 22px/1 "DM Sans",
          system-ui,
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #f7ebd7;
        opacity: 0;
        transition: opacity 0.7s ease;
      }
      .g-name.is-on {
        opacity: 0.92;
      }
      html.g-wait .g-net,
      html.g-wait .g-mark,
      html.g-wait .g-name,
      html.g-wait .g-prompt {
        visibility: hidden;
      }
      .g-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        margin: 0;
      }
      .g-prompt {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 1;
        display: flex;
        justify-content: center;
        padding: 0 max(16px, 6vw);
        pointer-events: none;
        visibility: hidden;
      }
      .g-prompt form {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 26rem);
        margin: 0;
        text-align: center;
      }
      .g-line {
        display: block;
        margin: 0;
        font:
          italic 400 clamp(1.08rem, 1.5vw, 1.32rem)/1.4 "Cormorant Garamond",
          Georgia,
          serif;
        color: var(--soft);
        text-wrap: balance;
      }
      .g-field {
        position: relative;
        display: flex;
        align-items: center;
        width: min(100%, 20rem);
        margin-top: 0.9rem;
        border-bottom: 1px solid rgb(240 200 119 / 0.3);
        transition: border-color 0.3s ease;
      }
      .g-field:focus-within {
        border-color: rgb(240 200 119 / 0.65);
      }
      .g-field input {
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 0.6rem 44px 0.5rem;
        border: 0;
        border-radius: 0;
        background: none;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        color: var(--ink);
        caret-color: #f0c67e;
        font:
          400 17px/1.3 "DM Sans",
          system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-align: center;
      }
      /* A selected key in the deck's gold, not the system's blue. */
      .g-field input::selection {
        background: rgb(240 200 119 / 0.3);
        color: #fff4df;
      }
      .g-go {
        position: absolute;
        right: -10px;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        color: #e0ab5e;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .g-go i {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid rgb(240 200 119 / 0.32);
        background: rgb(13 10 7 / 0.6);
        transition:
          border-color 0.25s ease,
          background-color 0.25s ease,
          color 0.25s ease,
          opacity 0.25s ease;
      }
      @media (hover: hover) {
        .g-go:hover i {
          border-color: rgb(255 214 150 / 0.8);
          background: rgb(240 200 119 / 0.1);
          color: #ffd991;
        }
      }
      .g-go:focus-visible {
        outline: none;
      }
      .g-go:focus-visible i {
        outline: 1px solid #f0c67e;
        outline-offset: 2px;
      }
      .g-go[aria-busy="true"] i {
        opacity: 0.45;
      }
      /* The larger touch ring ends where the field's line ends, as the small one does. */
      @media (pointer: coarse) {
        .g-go {
          right: -7px;
        }
        .g-go i {
          width: 30px;
          height: 30px;
        }
      }
      .g-note {
        min-height: 2.8em;
        margin: 0.85rem 0 0;
        font:
          italic 400 clamp(1rem, 1.2vw, 1.12rem)/1.4 "Cormorant Garamond",
          Georgia,
          serif;
        color: #e0ab5e;
        text-wrap: balance;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .g-note.is-on {
        opacity: 0.9;
      }
      html.g-still .g-mark,
      html.g-still .g-name,
      html.g-still .g-note,
      html.g-still .g-field {
        transition: none;
      }
    </style>
  </head>
  <body>
    <canvas class="g-net" aria-hidden="true"></canvas>
    <svg class="g-mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="g-name" aria-hidden="true">Mycelial</div>
    <main class="g-prompt">
      <h1 class="g-sr">Mycelial</h1>
      <form id="gate" action="./unlock" method="post" novalidate>
        <label class="g-line" for="key">Enter the personal key from your invitation.</label>
        <div class="g-field">
          <input
            id="key"
            name="key"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
          />
          <button class="g-go" type="submit" aria-label="Open the deck">
            <i
              ><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                <path
                  d="M6 3.5 10.5 8 6 12.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg
            ></i>
          </button>
        </div>
        <p class="g-note" id="note" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      (() => {
        const THREAD = "240,200,119",
          NODE = "255,217,145";
        const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
        const rnd = () => Math.random();
        // The mark is drawn once per changed frame on its own compact canvas.
        const MARK = {
          nodes: [
            [14, 24, 3.4],
            [29, 13, 3],
            [45, 21, 5],
            [50, 39, 3.2],
            [42, 51, 3],
            [21, 45, 4.6],
          ],
          curves: [
            [14, 24, 28, 23, 29, 13],
            [29, 13, 35, 30, 21, 45],
            [21, 45, 36, 31, 45, 21],
            [45, 21, 43, 35, 50, 39],
            [50, 39, 36, 37, 42, 51],
            [42, 51, 35, 38, 21, 45],
            [21, 45, 25, 33, 14, 24],
            [14, 24, 33, 25, 42, 51],
            [21, 45, 30, 32, 45, 21],
          ],
        };
        const drawMark = (g, m, cx, cy) => {
          const k = m.t;
          const S = (m.size * (1 - 0.94 * m.shrink)) / 54;
          const at = (x, y) => [cx + (x - 32) * S, cy + (y - 32) * S];
          const fade = (1 - 0.55 * m.shrink) * (m.faint || 1);
          const fine = m.faint ? 0.55 : 1;
          const halo = g.createRadialGradient(cx, cy, 0, cx, cy, 36 * S);
          halo.addColorStop(0, `rgba(${NODE},${(0.1 * clamp(k / 1) * fade).toFixed(3)})`);
          halo.addColorStop(1, `rgba(${NODE},0)`);
          g.fillStyle = halo;
          g.beginPath();
          g.arc(cx, cy, 36 * S, 0, 7);
          g.fill();
          g.strokeStyle = `rgba(${THREAD},${(0.8 * fade).toFixed(3)})`;
          // A phone's small mark keeps lines of real weight and tight glows (as dot-transitions.js drawMark).
          const glowK = 2.2 + 0.8 * Math.min(1, Math.max(0, (S - 1) / 1.5));
          g.lineWidth = Math.max(1.15, S * 0.66 * fine);
          g.beginPath();
          g.arc(cx, cy, 27 * S, -Math.PI / 2, -Math.PI / 2 + clamp(k / 0.8) * Math.PI * 2);
          g.stroke();
          g.lineWidth = Math.max(0.85, S * 0.5 * fine);
          MARK.curves.forEach(([x0, y0, qx, qy, x1, y1], i) => {
            const p = clamp((k - 0.2 - i * 0.05) / 0.5);
            if (p <= 0) return;
            g.beginPath();
            for (let s = 0; s <= 20; s++) {
              const t = (s / 20) * p,
                u = 1 - t;
              const [px, py] = at(u * u * x0 + 2 * u * t * qx + t * t * x1, u * u * y0 + 2 * u * t * qy + t * t * y1);
              s ? g.lineTo(px, py) : g.moveTo(px, py);
            }
            g.stroke();
          });
          MARK.nodes.forEach(([x, y, r], i) => {
            const a = clamp((k - 0.15 - i * 0.08) / 0.25) * fade;
            if (a <= 0) return;
            const [px, py] = at(x, y),
              rr = Math.max(1.4, r * S * 0.8 * (m.faint ? 0.55 : 1));
            const glow = g.createRadialGradient(px, py, 0, px, py, rr * glowK);
            glow.addColorStop(0, `rgba(${NODE},${(0.5 * a * fine).toFixed(3)})`);
            glow.addColorStop(1, `rgba(${NODE},0)`);
            g.fillStyle = glow;
            g.beginPath();
            g.arc(px, py, rr * glowK, 0, 7);
            g.fill();
            g.fillStyle = `rgba(255,236,190,${(a * fine * 1.2).toFixed(3)})`;
            g.beginPath();
            g.arc(px, py, rr, 0, 7);
            g.fill();
          });
        };
        const lengths = (pts) => {
          const len = [0];
          for (let i = 1; i < pts.length; i++)
            len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
          return len;
        };
        const wander = (a, b) => {
          const pts = [[a.x, a.y]];
          let x = a.x,
            y = a.y;
          let ang = Math.atan2(b.y - a.y, b.x - a.x) + (rnd() - 0.5) * 1.4;
          for (let i = 0; i < 600; i++) {
            const dx = b.x - x,
              dy = b.y - y,
              d = Math.hypot(dx, dy);
            if (d < 9) {
              pts.push([b.x, b.y]);
              break;
            }
            const diff = ((Math.atan2(dy, dx) - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
            ang += diff * (0.07 + 0.5 * clamp(1 - d / 260)) + (rnd() - 0.5) * 0.45;
            x += Math.cos(ang) * 6;
            y += Math.sin(ang) * 6;
            pts.push([x, y]);
          }
          return pts;
        };
        const pointAt = (h, d) => {
          let i = 1;
          while (i < h.len.length - 1 && h.len[i] < d) i++;
          const t = clamp((d - h.len[i - 1]) / (h.len[i] - h.len[i - 1] || 1));
          const [x0, y0] = h.pts[i - 1],
            [x1, y1] = h.pts[i];
          return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, ang: Math.atan2(y1 - y0, x1 - x0), i };
        };
        const net = document.querySelector(".g-net"),
          g = net.getContext("2d"),
          markCv = document.querySelector(".g-mark");
        const name = document.querySelector(".g-name"),
          prompt = document.querySelector(".g-prompt"),
          form = document.querySelector("#gate"),
          field = document.querySelector("#key"),
          button = document.querySelector(".g-go"),
          note = document.querySelector(".g-note");
        const still = document.documentElement.classList.contains("g-still");
        markCv.classList.add("is-on");
        const coarse = matchMedia("(pointer: coarse)"),
          fine = matchMedia("(pointer: fine)");
        let mark = null,
          hyphae = [],
          raf = 0,
          framePending = false,
          scheduleFrame = () => {},
          last = 0,
          elapsed = 0,
          markBox = 0,
          markMd = 1,
          markAt = null,
          markKey = "",
          dpr = 1;
        let opening = false,
          settled = false,
          revealStarted = false,
          revealElapsed = 0,
          revealDuration = 0,
          revealFar = 0,
          revealAt = null,
          settleFrom = [0, 0, 0], // y, size and gap the glide sets off from
          settleElapsed = 0,
          settleDuration = 0,
          revealDelay = 0;
        let motionLaunched = still,
          layoutW = innerWidth,
          layoutH = innerHeight,
          busy = false,
          handoff = false,
          handoffElapsed = 0,
          requestThreads = false,
          resizePending = false;
        // The visible middle as the opening and the hand-off follow it (visibleMiddle), and as last seen once settled.
        let middle = null,
          seenY = null,
          seatedGap = 0;
        /* visible-view:begin. One definition of the visible screen for the gate and the deck's opening.
           gate.html and index.html carry this same text; tests/visible-view.test.mjs holds the two equal. */
        // What is on screen is the visual viewport, not innerHeight (nor a fixed inset: 0 box, nor 100vh): Chrome on an
        // iPhone can report its large viewport there while a page loads, the bottom toolbar over its lower ~140 px, so a
        // middle taken from it sits ~70 px low. Under pinch zoom the visual viewport is a window onto the page; not used then.
        const visibleView = () => {
          const vv = window.visualViewport,
            w = innerWidth,
            h = innerHeight,
            on = !!vv && vv.width > 0 && vv.height > 0 && Math.abs((vv.scale || 1) - 1) < 0.01,
            vw = on ? Math.min(w, vv.width) : w,
            vh = on ? Math.min(h, vv.height) : h,
            left = on ? Math.max(0, vv.offsetLeft) : 0,
            top = on ? Math.max(0, vv.offsetTop) : 0;
          return { x: left + vw / 2, y: top + vh / 2, w: vw, h: vh, top, bottom: top + vh };
        };
        // That middle's height, re-read on every call, because no first read is to be trusted: iOS can settle its bars
        // without firing anything. A change glides over `glide` seconds (a smoothstep, so never a hop); sub-pixel noise is
        // taken as it comes.
        const visibleMiddle = (glide) => {
          let at = null,
            from = 0,
            to = 0,
            k = 1;
          return (dt) => {
            const want = visibleView().y;
            if (at === null || (k >= 1 && Math.abs(want - at) <= 0.5)) {
              at = from = to = want;
              k = 1;
              return at;
            }
            if (Math.abs(want - to) > 0.5) {
              from = at;
              to = want;
              k = 0;
            }
            k = Math.min(1, k + dt / glide);
            at = from + (to - from) * k * k * (3 - 2 * k);
            return at;
          };
        };
        /* visible-view:end */
        const seep = (k) => 0.5 - 0.5 * Math.cos(Math.PI * k);
        const easeIn = (k) => k * k * (3 - 2 * k) * k;
        // Passing threads grow, then fade; they never remain in the network.
        const target = (h) => {
          const fresh = h.done ? Math.exp(-h.after / Math.min(0.9, h.fade * 0.5)) : 1;
          return fresh * clamp(1 - h.after / h.fade);
        };
        const hypha = (pts, o = {}) => {
          const len = lengths(pts);
          hyphae.push({
            pts,
            len,
            total: len[len.length - 1],
            grown: 0,
            age: 0,
            after: 0,
            done: false,
            width: o.width || 0.8,
            alpha: o.alpha || 0.45,
            duration: o.duration || 0,
            tip: o.tip ?? 1,
            glow: 1,
            smooth: !!o.smooth,
            fade: o.fade || 4.5,
            depth: o.depth || 0,
          });
          wake();
        };
        const stampCanvas = document.createElement("canvas");
        stampCanvas.width = stampCanvas.height = 64;
        {
          const c = stampCanvas.getContext("2d"),
            grad = c.createRadialGradient(32, 32, 0, 32, 32, 32);
          grad.addColorStop(0, `rgba(${NODE},1)`);
          grad.addColorStop(1, `rgba(${NODE},0)`);
          c.fillStyle = grad;
          c.fillRect(0, 0, 64, 64);
        }
        const stamp = (x, y, r, a) => {
          if (a <= 0.003) return;
          g.globalAlpha = Math.min(1, a);
          g.drawImage(stampCanvas, x - r, y - r, 2 * r, 2 * r);
          g.globalAlpha = 1;
        };
        const drawThreads = () => {
          for (const h of hyphae) {
            const glow = h.glow;
            if (glow <= 0.005 || h.grown <= 0) continue;
            const end = h.grown >= h.total,
              tip = end ? { x: h.pts.at(-1)[0], y: h.pts.at(-1)[1], i: h.pts.length - 1 } : pointAt(h, h.grown);
            g.beginPath();
            g.moveTo(h.pts[0][0], h.pts[0][1]);
            for (let i = 1; i < tip.i; i++) g.lineTo(h.pts[i][0], h.pts[i][1]);
            g.lineTo(tip.x, tip.y);
            g.strokeStyle = `rgba(${THREAD},${(h.alpha * glow).toFixed(3)})`;
            g.lineWidth = h.width;
            g.stroke();
            if (!h.done) {
              const from = pointAt(h, Math.max(0, h.grown - 46));
              g.beginPath();
              g.moveTo(from.x, from.y);
              for (let i = from.i; i < tip.i; i++) g.lineTo(h.pts[i][0], h.pts[i][1]);
              g.lineTo(tip.x, tip.y);
              g.strokeStyle = `rgba(${NODE},${Math.min(1, h.alpha * 1.7 * h.tip).toFixed(3)})`;
              g.lineWidth = h.width + 0.5;
              g.stroke();
              stamp(tip.x, tip.y, h.depth ? 4 : 9, (h.depth ? 0.45 : 0.75) * h.tip);
            }
          }
        };
        // The mark on screen is vector, the brand's own geometry drawn in stroke by stroke, as in the deck
        // (dot-transitions.js), so it is as sharp as the wordmark on any phone. drawMark above, the same art on a
        // canvas, now only paints the poster the deck holds while it loads (makePoster).
        const SVGNS = "http://www.w3.org/2000/svg";
        const setAttrs = (n, attrs) => {
          for (const k in attrs) n.setAttribute(k, attrs[k]);
        };
        let markParts = null;
        const markSvg = () => {
          if (markParts) return markParts;
          const el = (tag, attrs, parent) => {
            const n = document.createElementNS(SVGNS, tag);
            setAttrs(n, attrs);
            parent.append(n);
            return n;
          };
          const defs = el("defs", {}, markCv);
          const glowOf = (id) => {
            const gr = el("radialGradient", { id }, defs);
            el("stop", { offset: 1, "stop-color": `rgb(${NODE})`, "stop-opacity": 0 }, gr);

          if (still) {
            mark = {
              x: innerWidth / 2,
              y: innerHeight / 2,
              t: 1.6,
              size: Math.min(innerWidth, innerHeight) * 0.2,
              shrink: 0,
            };
            name.classList.add("is-on");
            layout();
            prompt.style.visibility = "visible";
            markCv.classList.add("is-on");
            draw();
            if (arrival.has("key")) note.classList.add("is-on");
            document.fonts?.ready.then(() => {
              layout();
              draw();
            });
            return;
          }
          markCv.classList.add("is-on");
          let launched = false;
          const launch = () => {
            if (launched || settled) return;
            launched = true;
            motionLaunched = true;
            layoutW = prevW = innerWidth;
            layoutH = prevH = innerHeight;
            document.documentElement.classList.remove("g-wait");
            const { c, size } = layout(false);
            mark = { x: c.x, y: c.y, t: 0, size, shrink: 0 };
            middle = visibleMiddle(0.6);
            name.style.transform = nameAt(c.x - name.offsetWidth / 2, c.y + nameDrop(size));
            name.style.transitionDelay = ".35s";
            name.classList.add("is-on");
            prompt.style.visibility = "hidden";
            opening = true;
            elapsed = 0;
            wake();
          };
          const ceiling = setTimeout(() => launch(), 2500);
          try {
            const f = document.fonts,
              needed = [
                f.load('400 22px "DM Sans"', "MYCELIAL"),
                f.load('italic 400 16px "Cormorant Garamond"', "Enter"),
              ];
            Promise.allSettled([...needed, f.ready]).then(() => {
              clearTimeout(ceiling);
              launch();
            });
          } catch (e) {
            clearTimeout(ceiling);
            launch();
          }
        };
        let prevW = innerWidth,
          prevH = innerHeight;
        // A change of width finishes any choreography. A change of height alone (a phone's toolbar settling or
        // sliding) does not: the opening and the hand-off follow the visible middle frame by frame, and a settled
        // gate glides to its new place (reseat). A touch keyboard changing the height moves nothing.
        addEventListener("resize", () => {
          if (innerWidth === layoutW && innerHeight === layoutH) return;
          if (!motionLaunched && !still) {
            layoutW = prevW = innerWidth;
            layoutH = prevH = innerHeight;
            resizeNet();
            return;
          }
          if (coarse.matches && field === document.activeElement && innerWidth === prevW && innerHeight !== prevH) {
            prevH = innerHeight;
            return;
          }
          if (!still && innerWidth === layoutW) {
            layoutH = prevH = innerHeight;
            resizeNet();
            reseat();
            return;
          }
          resizePending = true;
          wake();
        });
        // iOS can settle its bars with no window resize at all; the visual viewport (or a page shown again) says so.
        window.visualViewport?.addEventListener("resize", reseat);
        window.visualViewport?.addEventListener("scroll", reseat);
        addEventListener("pageshow", reseat);
        addEventListener("load", reseat);
        addEventListener(
          "keydown",
          () => {
            if (opening) {
              finishOpening(true);
            }
          },
          { capture: true },
        );
        addEventListener(
          "pointerdown",
          () => {
            if (opening) finishOpening(false);
          },
          { capture: true },
        );
        initMotion();
        if (arrival.has("key") && still) note.classList.add("is-on");
      })();
    </script>
  </body>
</html>
