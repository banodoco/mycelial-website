name: Validate Flowers return and mobile stack
on:
  push:
    branches: [fix/flowers-return-mobile-stack-20261111]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed candidate to pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat .flowers-validation/part{0,1,2,3} | base64 -d > /tmp/flowers.patch.gz
          echo 'ab002f8f81d307274adbe66f004af54c107590a0a4bd5ceb0f4b8c88cf283c46  /tmp/flowers.patch.gz' | sha256sum --check
          git worktree add /tmp/flowers-candidate cce3de31d634699b55166a629ed9255cb8635c89
          gzip -dc /tmp/flowers.patch.gz > evidence/production.patch
          git -C /tmp/flowers-candidate apply --unidiff-zero --check "$GITHUB_WORKSPACE/evidence/production.patch"
          git -C /tmp/flowers-candidate apply --unidiff-zero "$GITHUB_WORKSPACE/evidence/production.patch"
          cp .flowers-validation/test.mjs /tmp/flowers-candidate/tests/deck-flowers-return.test.mjs
          cp .flowers-validation/check.py /tmp/flowers-candidate/tools/deck/check-flowers-return.py
          cp .flowers-validation/documentation.md /tmp/flowers-candidate/docs/flowers-return-mobile-stack.md
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/flowers-candidate/tests/deck-scene-resilience.test.mjs')
          s=p.read_text();old='expose(media,{current:'
          assert s.count(old)==3
          p.write_text(s.replace(old,'expose(media,{window:{},current:'))
          PY
          python .flowers-validation/refine.py
          cd /tmp/flowers-candidate
          node --check mycelial/flowers.js
          node --check mycelial/stack.js
          node --test --test-concurrency=1 tests/deck-story.test.mjs tests/deck-copy-surfaces.test.mjs tests/deck-scene-resilience.test.mjs tests/deck-flowers-return.test.mjs | tee "$GITHUB_WORKSPACE/evidence/unit.txt"
      - name: Install browser engines
        run: |
          python -m pip install playwright Pillow numpy
          python -m playwright install --with-deps chromium webkit
      - name: Validate real artwork and unchanged text choreography
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/flowers-candidate && PORT=8240 python3 serve.py) > evidence/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8240/mycelial/index.html >/dev/null && break; sleep 1; done
          cd /tmp/flowers-candidate
          python tools/deck/check-flowers-return.py --out "$GITHUB_WORKSPACE/evidence/flowers" | tee "$GITHUB_WORKSPACE/evidence/flowers.txt"
          python tools/deck/check-copy-ownership.py --out "$GITHUB_WORKSPACE/evidence/copy" | tee "$GITHUB_WORKSPACE/evidence/copy.txt"
      - name: Publish tested candidate without temporary validation files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/flowers-candidate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mycelial/flowers.js mycelial/stack.js mycelial/index.html tests/deck-scene-resilience.test.mjs tests/deck-flowers-return.test.mjs tools/deck/check-flowers-return.py docs/flowers-return-mobile-stack.md
          git diff --cached > "$GITHUB_WORKSPACE/evidence/candidate.patch"
          git commit -m 'Restore Flowers canvas safely on return and use still stack preview on mobile'
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/evidence/candidate-sha.txt"
          git push origin HEAD:refs/heads/candidate/flowers-return-mobile-stack-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flowers-return-validation
          path: evidence/
          retention-days: 7
