name: Validate scene resilience
on:
  push:
    branches: [fix/scene-resilience-20261111]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export pinned source for local inspection
        run: |
          mkdir -p evidence
          git archive --format=zip b519a881e7a29e8536461ddd47eac547128b8626 mycelial docs tests tools/deck serve.py package.json > evidence/sources.zip
          git ls-tree -r b519a881e7a29e8536461ddd47eac547128b8626 > evidence/source-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scene-resilience-sources
          path: evidence/
          retention-days: 7
